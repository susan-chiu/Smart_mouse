<!doctype html><html lang="zh-Hant"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>聰明鼠</title>
<meta name="description" content="聰明鼠：比特幣新手教學。防詐演練、保管演練、真實價格歷史回測。僅供教育用途，不提供交易或投資建議。">
<meta name="theme-color" content="#EC5F9E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Huninn&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: a storybook forest adventure — squirrel guide in the hero, a stepping-stone map of six places, rounded wooden-sign panels; data pages keep precise numbers in the same soft palette */
:root{
  --bg:#F3F7E8; --panel:#FFFFFF; --panel2:#FBFDF4; --line:#E1E9CF; --line2:#CAD8B0;
  --fg:#2F2A1E; --muted:#6C6751; --dim:#9C977E; --grid:#E6EDD6; --grid2:#EFF4E2;
  --cyan:#3F8F45; --cyan-soft:rgba(63,143,69,.12); --amber:#C2702A; --amber-soft:rgba(194,112,42,.13);
  --up:#2F8A57; --up-soft:rgba(47,138,87,.12); --down:#D0533D; --down-soft:rgba(208,83,61,.11);
  --sun:#F4C246; --sky:#D5EBF3; --on-accent:#FFFFFF; --field:#FFFFFF;
  --shadow:0 2px 0 rgba(84,74,40,.10),0 12px 24px -16px rgba(84,74,40,.40);
  --f-display:"Baloo 2","Huninn","Zen Maru Gothic",system-ui,sans-serif;
  --f-body:"Huninn","Zen Maru Gothic",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Baloo 2",system-ui,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1C19; --panel:#172A25; --panel2:#1B302A; --line:#284239; --line2:#355449;
  --fg:#EEF3E4; --muted:#A9BBA6; --dim:#71877A; --grid:#22392F; --grid2:#1D3129;
  --cyan:#86D27A; --cyan-soft:rgba(134,210,122,.14); --amber:#F2A65C; --amber-soft:rgba(242,166,92,.15);
  --up:#72D99A; --up-soft:rgba(114,217,154,.13); --down:#FF8C77; --down-soft:rgba(255,140,119,.13);
  --sun:#F3E27A; --sky:#1C3540; --on-accent:#0F1C19; --field:#12221E;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 14px 28px -16px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1C19; --panel:#172A25; --panel2:#1B302A; --line:#284239; --line2:#355449;
  --fg:#EEF3E4; --muted:#A9BBA6; --dim:#71877A; --grid:#22392F; --grid2:#1D3129;
  --cyan:#86D27A; --cyan-soft:rgba(134,210,122,.14); --amber:#F2A65C; --amber-soft:rgba(242,166,92,.15);
  --up:#72D99A; --up-soft:rgba(114,217,154,.13); --down:#FF8C77; --down-soft:rgba(255,140,119,.13);
  --sun:#F3E27A; --sky:#1C3540; --on-accent:#0F1C19; --field:#12221E;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 14px 28px -16px rgba(0,0,0,.6); color-scheme:dark}
:root:lang(ja){--f-body:"Zen Maru Gothic","Huninn",system-ui,"Hiragino Sans","Yu Gothic",sans-serif}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.75;padding-inline:16px;padding-block:0 56px;
  background-image:radial-gradient(900px 340px at 85% -120px,var(--sky),transparent 70%),radial-gradient(circle at 1px 1px,var(--grid) 1.2px,transparent 1.3px);background-size:auto,26px 26px}
.wrap{max-width:900px;margin:0 auto}
.mono{font-family:var(--f-mono)}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{font:700 1.05rem var(--f-display);display:flex;align-items:center;gap:8px}
.brand .sq{width:34px;height:34px;display:grid;place-items:center}
.brand small{font:600 .78rem var(--f-body);color:var(--muted)}
.lang{display:flex;background:var(--panel);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.lang button{background:none;border:0;color:var(--muted);font:600 .8rem var(--f-body);padding:5px 12px;cursor:pointer;border-radius:999px}
.lang button[aria-pressed="true"]{background:var(--cyan);color:var(--on-accent)}
.lang button:focus-visible,.tabs button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* ticker as a wooden notice board */
.ticker{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:8px}
.tk{background:var(--panel);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);min-width:0;border-top:4px solid var(--line2)}
.tk:first-child{border-top-color:var(--amber)}
.tk .l{font-size:.74rem;color:var(--muted);font-weight:700}
.tk .v{font:700 1.3rem/1.3 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tk .s{font:500 .7rem var(--f-num);color:var(--dim)}
.up{color:var(--up)} .down{color:var(--down)} .amb{color:var(--amber)}
.asof{font-size:.74rem;color:var(--dim);margin-top:8px;display:flex;align-items:center;gap:6px}
.asof::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--up)}

.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding-block:24px 4px}
.hero>*{min-width:0}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,6vw,2.9rem);line-height:1.18;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--cyan);background:linear-gradient(transparent 64%,color-mix(in srgb,var(--sun) 40%,transparent) 64% 92%,transparent 92%);padding:0 2px}
@media (max-width:560px){.tk:last-child:nth-child(odd){grid-column:1/-1}}
.hero p{color:var(--muted);margin:10px 0 0;max-width:58ch}
.buddy{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px}
.buddy svg{width:120px;height:120px;filter:drop-shadow(0 6px 6px rgba(84,74,40,.18))}
.speech{background:var(--panel);border-radius:14px;padding:6px 12px;font-size:.8rem;font-weight:700;box-shadow:var(--shadow);text-align:center;position:relative;line-height:1.4}
.speech::before{content:"";position:absolute;top:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-top:0;border-bottom-color:var(--panel)}
.speech b{color:var(--amber);font-family:var(--f-num)}
.speech span{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
@media (max-width:560px){.hero{grid-template-columns:1fr}.buddy{flex-direction:row;width:auto}.buddy svg{width:84px;height:84px}}
@keyframes bob{50%{transform:translateY(-4px)}}
.buddy svg{animation:bob 3.2s ease-in-out infinite}

/* tabs as pill trail */
.tabs{display:flex;gap:6px;margin-top:22px;overflow-x:auto;padding:4px 2px 8px}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;font:700 .9rem var(--f-body);color:var(--muted);border-radius:999px;white-space:nowrap;background:var(--panel);box-shadow:var(--shadow);display:flex;gap:6px;align-items:center}
.tabs button .ix{display:none}
.tabs button[aria-selected="true"]{background:var(--cyan);color:var(--on-accent)}

/* map trail */
nav.trail{margin-block:16px 4px;overflow-x:auto}
.trail ol{list-style:none;margin:0;padding:6px 2px 8px;display:flex;align-items:flex-start;min-width:620px}
.trail li{flex:1;position:relative;display:flex;flex-direction:column;align-items:center}
.trail li:not(:last-child)::after{content:"";position:absolute;top:26px;left:calc(50% + 30px);right:calc(-50% + 30px);border-top:3px dotted var(--line2)}
.trail li:nth-child(even){margin-top:18px}
.trail li:nth-child(odd):not(:last-child)::after{top:36px;transform:rotate(9deg)}
.trail li:nth-child(even):not(:last-child)::after{top:16px;transform:rotate(-9deg)}
.trail li.done:not(:last-child)::after{border-color:var(--cyan)}
.trail button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.trail .dot{width:54px;height:54px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;border:3px solid var(--line2);transition:transform .2s}
.trail .dot svg{width:30px;height:30px}
.trail .lbl{font-size:.78rem;font-weight:700;line-height:1.25;max-width:9em}
.trail .sub{font-size:.68rem;color:var(--muted);line-height:1.2}
.trail li.done .dot{border-color:var(--sun);background:var(--amber-soft)}
.trail li.active .dot{border-color:var(--cyan);transform:scale(1.1);box-shadow:0 0 0 5px var(--cyan-soft),var(--shadow)}
.trail button:hover .dot{transform:translateY(-2px)}
.trail button:focus-visible .dot{outline:3px solid var(--sun);outline-offset:3px}

/* panels */
section.panel{position:relative;background:var(--panel);border-radius:22px;padding:clamp(18px,4vw,30px);margin-top:16px;box-shadow:var(--shadow)}
.eyebrow{font-size:.78rem;font-weight:700;color:var(--cyan);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow .pl{background:var(--cyan-soft);padding:2px 10px;border-radius:999px}
.panel h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.45rem,4.6vw,1.95rem);line-height:1.25;margin:6px 0 6px;text-wrap:balance}
.panel .lead{color:var(--muted);margin:0 0 18px;max-width:66ch}
.points{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.points li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:12px 14px;background:var(--panel2);border-radius:14px;border:1px solid var(--line)}
.points li>*{min-width:0}
.points .k{width:30px;height:30px;border-radius:50%;background:var(--amber-soft);color:var(--amber);display:grid;place-items:center;font:700 .9rem var(--f-num)}
.points b{display:block;font-weight:700}
.points span{color:var(--muted)}
.warnbox,.tipbox{margin-top:14px;padding:12px 14px;font-size:.94rem;border-radius:14px}
.warnbox{background:var(--down-soft)}
.warnbox strong{color:var(--down);margin-right:8px;font-family:var(--f-num)}
.tipbox{background:var(--amber-soft)}
.tipbox strong{color:var(--amber);margin-right:8px;font-family:var(--f-num)}

/* RSI */
.tool{margin-top:18px;border:2px dashed var(--line2);border-radius:16px;padding:16px}
.tool h3{margin:0 0 4px;font:700 1.05rem var(--f-display)}
.tool label{font-size:.85rem;color:var(--muted)}
.rsirow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
input[type=range]{flex:1;min-width:160px;accent-color:var(--cyan)}
.rsival{font:800 2rem var(--f-num);font-variant-numeric:tabular-nums;width:3ch;text-align:right}
.rsibar{height:10px;border-radius:5px;margin:10px 0 4px;background:linear-gradient(90deg,var(--sky) 0 30%,var(--line) 30% 70%,var(--amber-soft) 70% 100%);border:1px solid var(--line2)}
.rsiscale{display:flex;justify-content:space-between;font:600 .72rem var(--f-num);color:var(--muted)}
.chip{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 10px;margin-right:8px;border-radius:999px}
.chip.hot{color:var(--amber);background:var(--amber-soft)} .chip.cold{color:var(--cyan);background:var(--cyan-soft)} .chip.mid{color:var(--muted);background:var(--line)}
.rsimsg{margin-top:10px;font-size:.95rem}

/* quiz */
.quiz{margin-top:24px;border-top:2px dotted var(--line2);padding-top:18px}
.quiz h3{font:700 1.15rem var(--f-display);margin:0 0 2px}
.quiz .sub{color:var(--muted);font-size:.86rem;margin:0 0 14px}
.q{margin-bottom:18px}
.q p{margin:0 0 8px;font-weight:700}
.opts{display:grid;gap:8px}
.opts button{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--panel2);font-size:.95rem;line-height:1.5}
.opts button:hover:not([disabled]){border-color:var(--cyan)}
.opts button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.opts button.right{border-color:var(--up);background:var(--up-soft)}
.opts button.wrong{border-color:var(--down);background:var(--down-soft)}
.opts button[disabled]{cursor:default}
.explain{font-size:.88rem;color:var(--muted);margin-top:6px}
.result{padding:12px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-radius:14px}
.result.pass{color:var(--up);background:var(--up-soft)}
.result.fail{color:var(--down);background:var(--down-soft)}
.result .acorn-get{display:flex;align-items:center;gap:6px}
.result .acorn-get svg{width:26px;height:26px}
.btn{all:unset;cursor:pointer;background:var(--cyan);color:var(--on-accent);font:700 .92rem var(--f-body);padding:9px 20px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.18);text-align:center}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--panel2);color:var(--fg);box-shadow:inset 0 0 0 2px var(--line2)}
.btn.red{background:var(--down);color:var(--on-accent)}
.btn.green{background:var(--up);color:var(--on-accent)}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:14px;background:var(--amber-soft);border-radius:18px;padding:14px;margin-top:16px}
.badge .seal{width:70px;height:70px;flex:none}
.badge .seal svg{width:70px;height:70px}

/* drill */
.drill-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.prog{flex:1;min-width:160px;height:10px;background:var(--line);border-radius:5px;position:relative;overflow:hidden}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--cyan);border-radius:5px}
.cnt{font:700 .85rem var(--f-num);color:var(--muted)}
.score{font:700 .85rem var(--f-num);color:var(--up)}
.knock{font-weight:700;text-align:center;margin:4px 0 12px;color:var(--amber)}
.device{max-width:440px;margin:0 auto;border-radius:22px;background:var(--panel2);border:2px solid var(--line2);padding:14px;box-shadow:var(--shadow)}
.dev-h{display:flex;justify-content:space-between;font-size:.72rem;font-weight:700;color:var(--dim);margin-bottom:10px}
.from{font-weight:700;font-size:.92rem;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.from .av{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font:700 .75rem var(--f-num);color:var(--muted);flex:none}
.bubble{background:var(--panel);border:1px solid var(--line);padding:12px 14px;border-radius:4px 16px 16px 16px;font-size:.96rem}
.urlbar{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line2);border-radius:999px;padding:7px 12px;font:500 .8rem var(--f-mono);overflow-x:auto;white-space:nowrap;margin-bottom:10px}
.urlbar .lk{color:var(--muted)}
.mailh{font:500 .78rem var(--f-mono);color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;word-break:break-all}
.choose{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.verdict{margin-top:16px;padding:14px 16px;border-radius:16px}
.verdict.ok{background:var(--up-soft)}
.verdict.no{background:var(--down-soft)}
.verdict .vh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700;margin-bottom:6px}
.tag{font:700 .72rem var(--f-num);padding:2px 10px;border-radius:999px;letter-spacing:.04em}
.tag.scam{background:var(--down);color:var(--on-accent)} .tag.safe{background:var(--up);color:var(--on-accent)}
.verdict ul{margin:6px 0 0;padding-left:1.2em}
.verdict li{margin-bottom:4px}
.verdict .ft{font-size:.78rem;font-weight:700;color:var(--muted)}

/* backtest & shared form */
.bt-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:12px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:700;color:var(--muted)}
.field input,.field select{font:700 1.02rem var(--f-num);color:var(--fg);background:var(--field);border:2px solid var(--line2);border-radius:12px;padding:8px 12px;width:100%}
.field input:focus,.field select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-soft)}
.presets{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.presets .pl{font-size:.8rem;font-weight:700;color:var(--muted);margin-right:4px}
.pchip{all:unset;cursor:pointer;font:700 .82rem var(--f-body);background:var(--panel2);box-shadow:inset 0 0 0 2px var(--line2);padding:5px 12px;border-radius:999px;color:var(--muted)}
.pchip[aria-pressed="true"]{color:var(--on-accent);background:var(--cyan);box-shadow:none}
.pchip:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.barn{display:flex;align-items:center;gap:12px;background:var(--amber-soft);border-radius:16px;padding:10px 14px;margin-bottom:12px;font-weight:700}
.barn svg{width:44px;height:44px;flex:none}
.barn b{font-family:var(--f-num);color:var(--amber);font-size:1.15rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:8px;margin-bottom:18px}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0}
.kpi .l{font-size:.74rem;font-weight:700;color:var(--muted)}
.kpi .v{font:800 1.3rem/1.3 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font:500 .72rem var(--f-num);color:var(--dim)}
.kpi.hero-k{background:var(--cyan-soft);border-color:transparent}
.kpi.hero-k .v{font-size:1.6rem}
.ch-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 6px}
.ch-h h3{margin:0;font:700 1rem var(--f-display)}
.tgl{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--muted);cursor:pointer}
.tgl input{accent-color:var(--cyan)}
.chart{overflow-x:auto;border-radius:16px;background:var(--panel2);border:1px solid var(--line);margin-bottom:6px}
.chart svg{display:block;width:100%;min-width:340px;height:auto}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.76rem;font-weight:700;color:var(--muted);margin-bottom:18px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.src{font-size:.74rem;color:var(--dim);margin-top:4px;line-height:1.6}
footer{margin-top:28px;font-size:.78rem;color:var(--dim);border-top:2px dotted var(--line2);padding-top:14px}

/* custody */
.steps{list-style:none;margin:0 0 18px;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps li{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:8px 10px;font-size:.84rem;font-weight:700;color:var(--muted);display:flex;gap:8px;align-items:center;min-width:0}
.steps li span{font:700 .8rem var(--f-num);width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;flex:none}
.steps li.on{color:var(--fg);border-color:var(--cyan)} .steps li.on span{background:var(--cyan);color:var(--on-accent)}
.steps li.done{color:var(--up)} .steps li.done span{background:var(--up-soft)}
.sth{font:700 1.15rem var(--f-display);margin:4px 0}
.muted{color:var(--muted);margin:0 0 12px}
.fakeband{font-size:.74rem;font-weight:700;color:var(--amber);border:2px dashed var(--amber);border-radius:999px;padding:3px 12px;margin-bottom:12px;display:inline-block}
.seed{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(130px,100%),1fr));gap:8px;margin-bottom:12px;background:var(--amber-soft);padding:12px;border-radius:18px}
.seed div{background:var(--panel);border-radius:10px;padding:7px 10px;font:600 .95rem var(--f-mono)}

/* v10: kawaii town theme — pastel daytime market, neon night market */
:root{
  --bg:#FFF4F9; --panel:#FFFFFF; --panel2:#FFF8FC; --line:#F6DDEB; --line2:#EDC7DD;
  --fg:#4A3550; --muted:#8A7192; --dim:#B5A0BA; --grid:#F8E1EE; --grid2:#FCEFF6;
  --cyan:#EC5F9E; --cyan-soft:rgba(236,95,158,.12); --amber:#E39A2C; --amber-soft:rgba(246,198,78,.20);
  --up:#2FAE84; --up-soft:rgba(47,174,132,.12); --down:#E5566E; --down-soft:rgba(229,86,110,.11);
  --sun:#FFD45C; --sky:#E4EEFF; --on-accent:#FFFFFF; --field:#FFFFFF; --lav:#C9B3F5; --mint:#9EE6CF;
  --shadow:0 3px 0 rgba(236,95,158,.10),0 14px 26px -16px rgba(120,60,110,.38);
}

    h+=`</div>${a!==undefined?`<div class="explain">${esc(q[3])}</div>`:''}</div>`;
  });
  if(QS.every((_,k)=>S.answers[i+'-'+k]!==undefined)){
    const r=QS.filter(([qi],k)=>S.answers[i+'-'+k]===L.quiz[qi][2]).length, ok=r>=2;

}

function chart(series,labels,log,hc){
  const W=680,H=250,Lp=62,R=16,Tp=14,Bp=28, n=labels.length;
  const all=series.flatMap(s=>s.d).filter(v=>v>0);
  let lo=log?Math.min(...all):0, hi=Math.max(...all);
  let ticks=[];
  if(log){const steps=[1,2,5];for(let e=0;e<8;e++)for(const s of steps){const v=s*10**e; if(v>=lo*0.9&&v<=hi*1.1) ticks.push(v)}
    if(ticks.length>6) ticks=ticks.filter((v,i)=>String(v)[0]==='1'||ticks.length<=6); lo=lo*0.85; hi=hi*1.15;}
  else{const raw=hi/4, mag=10**Math.floor(Math.log10(raw)), st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw); hi=Math.ceil(hi*1.04/st)*st; for(let v=0;v<=hi;v+=st) ticks.push(v)}
  const tr=v=>log?Math.log10(v):v, y=v=>Tp+(1-(tr(v)-tr(lo))/(tr(hi)-tr(lo)))*(H-Tp-Bp), x=i=>Lp+(n>1?i/(n-1):0)*(W-Lp-R);
  const lab=v=>v>=1e6?'$'+fmt(v/1e6,v%1e6?1:0)+'M':v>=1e3?'$'+fmt(v/1e3,v%1e3?1:0)+'k':'$'+fmt(v);
  let g=ticks.map(v=>`<line x1="${Lp}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/><text x="${Lp-8}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="Baloo 2,sans-serif" font-weight="700">${lab(v)}</text>`).join('');
  const yrs=[];labels.forEach((l,i)=>{if(l.endsWith('-01')||i===0)yrs.push(i)});
  if(yrs.length>1&&yrs[0]===0&&x(yrs[1])-x(0)<46)yrs.shift();
  const step=Math.ceil(yrs.length/7); const xl=yrs.filter((_,j)=>j%step===0).map(i=>`<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${Tp}" y2="${H-Bp}" stroke="var(--grid2)" stroke-width="1"/><text x="${x(i).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="Baloo 2,sans-serif" font-weight="700">${labels[i].slice(0,4)}</text>`).join('');
  const path=(d,step)=>d.map((v,i)=>{const X=x(i).toFixed(1),Y=y(Math.max(v,lo)).toFixed(1); if(i===0)return `M${X} ${Y}`; return step?`H${X} V${Y}`:`L${X} ${Y}`}).join(' ');
  let body='';
  series.forEach((s,si)=>{const p=path(s.d,s.step); if(s.area) body+=`<path d="${p} L${x(n-1).toFixed(1)} ${y(lo).toFixed(1)} L${x(0).toFixed(1)} ${y(lo).toFixed(1)} Z" fill="${s.c}" fill-opacity=".09" stroke="none"/>`;
    body+=`<path d="${p}" fill="none" stroke="${s.c}" stroke-width="${s.w}" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/>`;
    const v=s.d[n-1]; body+=`<circle cx="${x(n-1).toFixed(1)}" cy="${y(Math.max(v,lo)).toFixed(1)}" r="3.5" fill="${s.c}"/>`;});
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${hc?esc(hc.names.join(" / ")):"chart"}">${xl}${g}${body}</svg>`;
  return hc?hcAttach(hc.id,svg,{W,H,Lp,R,Tp,Bp,n,x,lab:hc.lab,rows:k=>series.map((s,si)=>[hc.names[si],usd(s.d[k]),s.c,y(Math.max(s.d[k],lo))])}):svg;
}

const IND=(()=>{const rsi=Array(DN).fill(null),m50=Array(DN).fill(null),m200=Array(DN).fill(null),h90=Array(DN).fill(null),w200=Array(DN).fill(null),
  macd=Array(DN).fill(null),sig=Array(DN).fill(null),bu=Array(DN).fill(null),bl=Array(DN).fill(null);
  let g=0,l=0;for(let i=1;i<DN;i++){const ch=DC[i]-DC[i-1],up=Math.max(ch,0),dn=Math.max(-ch,0);
    if(i<=14){g+=up/14;l+=dn/14;if(i===14)rsi[i]=l===0?100:100-100/(1+g/l)}else{g=(g*13+up)/14;l=(l*13+dn)/14;rsi[i]=l===0?100:100-100/(1+g/l)}}
  let s50=0,s200=0,s1400=0,s20=0,q20=0;
  for(let i=0;i<DN;i++){const v=DC[i];s50+=v;s200+=v;s1400+=v;s20+=v;q20+=v*v;
    if(i>=50)s50-=DC[i-50];if(i>=200)s200-=DC[i-200];if(i>=1400)s1400-=DC[i-1400];if(i>=20){s20-=DC[i-20];q20-=DC[i-20]*DC[i-20]}
    if(i>=49)m50[i]=s50/50;if(i>=199)m200[i]=s200/200;if(i>=1399)w200[i]=s1400/1400;
    if(i>=19){const m=s20/20,sd=Math.sqrt(Math.max(0,q20/20-m*m));bu[i]=m+2*sd;bl[i]=m-2*sd}
    let h=0;for(let j=Math.max(0,i-89);j<=i;j++)if(DC[j]>h)h=DC[j];h90[i]=h;}
  let e12=DC[0],e26=DC[0],e9=0;const k12=2/13,k26=2/27,k9=2/10;
  for(let i=0;i<DN;i++){e12=i?DC[i]*k12+e12*(1-k12):DC[0];e26=i?DC[i]*k26+e26*(1-k26):DC[0];const m=e12-e26;e9=i?m*k9+e9*(1-k9):m;if(i>=34){macd[i]=m;sig[i]=e9}}
  return {rsi,m50,m200,h90,w200,macd,sig,bu,bl};})();
const RULE_DEF={mode:'any',on:[false,true,false,false,false,false,false,false],rsiV:30,ddV:20,mayerV:1.0};
const SG=Object.assign({amt:50,from:2021},JSON.parse(JSON.stringify(RULE_DEF)));
let MYRULE=null; try{const r=JSON.parse(localStorage.getItem('c101rule')||'null'); if(r&&Array.isArray(r.on)&&r.on.length===8) MYRULE=r;}catch(e){}
function condParts(i,c){const I=IND,p=DC[i];
  const mx=()=>{for(let j=i;j>i-3&&j>0;j--){if(I.macd[j]!==null&&I.macd[j-1]!==null&&I.macd[j]>I.sig[j]&&I.macd[j-1]<=I.sig[j-1])return true}return false};
  return [I.rsi[i]!==null&&I.rsi[i]<c.rsiV, I.m200[i]!==null&&p<I.m200[i], p<=I.h90[i]*(1-c.ddV/100), I.m50[i]!==null&&I.m200[i]!==null&&I.m50[i]>I.m200[i],
    mx(), I.bl[i]!==null&&p<I.bl[i], I.w200[i]!==null&&p<I.w200[i], I.m200[i]!==null&&p/I.m200[i]<c.mayerV];}
function cond(i,c=SG){const r=condParts(i,c),sel=r.filter((_,k)=>c.on[k]); if(!sel.length) return false; return c.mode==='any'?sel.some(Boolean):sel.every(Boolean);}
function simulate(c,from,amt){const L=DN-1,s=DC.findIndex((_,i)=>dIso(i)===`${from}-01-01`);
  let cD=0,cS=0,cash=0,inv=0,buys=[],ws=null,maxW=0;
  for(let i=s;i<=L;i++){if(i===s||dIso(i).endsWith('-01')){inv+=amt;cD+=amt/DC[i];if(cash===0)ws=i;cash+=amt;}
    if(cash>0&&cond(i,c)){cS+=cash/DC[i];cash=0;buys.push(i);maxW=Math.max(maxW,i-ws);}}
  if(cash>0)maxW=Math.max(maxW,L-ws);
  return {s,L,inv,cD,cS,cash,buys,maxW,vD:cD*DC[L],vS:cS*DC[L]+cash};}
function condLabels(c,t){return [t.c1(c.rsiV),t.c2,t.c3(c.ddV),t.c4,t.c5,t.c6,t.c7,t.c8(fmt(c.mayerV,2))]}
function readings(i){const td=TD[lang],I=IND,p=DC[i],r=I.rsi[i],v200=(p/I.m200[i]-1)*100,up=I.m50[i]>I.m200[i],mu=I.macd[i]>I.sig[i],
  bo=p>I.bu[i]?'U':p<I.bl[i]?'L':'M',w=(p/I.w200[i]-1)*100,my=p/I.m200[i],dd=(p/I.h90[i]-1)*100;
  return [[td.rsi,fmt(r,1),r>=70?'amb':r<=30?'up':'',r>=70?td.states.hot:r<=30?td.states.cold:td.neutral],
   [td.macd,mu?td.macdUp:td.macdDn,mu?'up':'down',`${fmt(I.macd[i])} / ${fmt(I.sig[i])}`],
   [td.boll,bo==='U'?td.bollU:bo==='L'?td.bollL:td.bollM,bo==='U'?'amb':bo==='L'?'up':'',`${usd(I.bl[i])} – ${usd(I.bu[i])}`],
   [td.vs200,pct(v200),v200>=0?'up':'down',usd(I.m200[i])],
   [td.trend,up?td.above:td.below,up?'up':'down',`${usd(I.m50[i])} / ${usd(I.m200[i])}`],
   [td.w200,pct(w),w>=0?'up':'down',usd(I.w200[i])],
   [td.mayer,fmt(my,2),my<1?'up':my>2.4?'amb':'',my<1?td.mayerLo:my>2.4?td.mayerHi:td.mayerMid],
   [td.dd90,pct(dd),dd<=-20?'up':'',usd(I.h90[i])]];}
function marketState(i){const I=IND,r=I.rsi[i],p=DC[i];
  if(r>=70)return 'hot'; if(r<=30)return 'cold';
  if(p>I.m200[i]&&I.m50[i]>I.m200[i])return 'up'; if(p<I.m200[i]&&I.m50[i]<I.m200[i])return 'down'; return 'range';}
function kpiGrid(rows){return `<div class="kpis ind8">${rows.map(r=>`<div class="kpi"><div class="l">${esc(r[0])}</div><div class="v ${r[2]}">${esc(r[1])}</div><div class="s">${esc(r[3])}</div></div>`).join('')}</div>`}

function drawSignal(){

  if(a==='copy'){G.flags.backup=true;saveG();setTimeout(checkQuests,0);const txt='date,usd,btc,note\n'+ST.entries.map(e=>`${e.date},${e.usd},${e.btc},"${(e.note||'').replace(/"/g,'""')}"`).join('\n');

function startSnow(cv){if(snowRAF)return;const ctx=cv.getContext('2d');let fl=[];
  const size=()=>{cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;fl=Array.from({length:Math.min(70,Math.round(innerWidth/14))},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:(1.2+Math.random()*2.6)*devicePixelRatio,s:(.3+Math.random()*.8)*devicePixelRatio,d:Math.random()*6}))};
  size();addEventListener('resize',size);
  const tick=()=>{ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='rgba(255,255,255,.85)';
    for(const f of fl){f.y+=f.s;f.x+=Math.sin((f.y/40)+f.d)*.4*devicePixelRatio;if(f.y>cv.height){f.y=-5;f.x=Math.random()*cv.width}ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.283);ctx.fill()}

function sigChart(s,e,buys){
  const W=680,H=270,Lp=62,R=14,Tp=12,Bp=28; const n=e-s+1, stp=Math.max(1,Math.floor(n/700));
  let lo=Infinity,hi=0;for(let i=s;i<=e;i++){lo=Math.min(lo,DC[i]);hi=Math.max(hi,DC[i])} lo*=0.85;hi*=1.12;
  const lg=Math.log10, x=i=>Lp+(i-s)/(n-1)*(W-Lp-R), y=v=>Tp+(1-(lg(v)-lg(lo))/(lg(hi)-lg(lo)))*(H-Tp-Bp);
  const ticks=[];for(let k=2;k<7;k++)for(const m of [1,2,5]){const v=m*10**k;if(v>=lo&&v<=hi)ticks.push(v)}
  const tk=ticks.length>7?ticks.filter((v,i)=>i%2===0):ticks;
  const lab=v=>v>=1e3?'$'+fmt(v/1e3)+'k':'$'+fmt(v);
  let g=tk.map(v=>`<line x1="${Lp}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--grid)"/><text x="${Lp-8}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="Baloo 2,sans-serif" font-weight="700">${lab(v)}</text>`).join('');
  const yrs=[];for(let i=s;i<=e;i++)if(dIso(i).endsWith('-01-01'))yrs.push(i); const ys=Math.ceil(yrs.length/7);
  g+=yrs.filter((_,j)=>j%ys===0).map(i=>`<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${Tp}" y2="${H-Bp}" stroke="var(--grid2)"/><text x="${x(i).toFixed(1)}" y="${H-9}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="Baloo 2,sans-serif" font-weight="700">${dIso(i).slice(0,4)}</text>`).join('');
  let p='',m='';for(let i=s;i<=e;i+=stp){p+=(p?'L':'M')+x(i).toFixed(1)+' '+y(DC[i]).toFixed(1);if(IND.m200[i])m+=(m?'L':'M')+x(i).toFixed(1)+' '+y(Math.max(IND.m200[i],lo)).toFixed(1)}
  p+='L'+x(e).toFixed(1)+' '+y(DC[e]).toFixed(1);
  const dots=buys.map(i=>`<circle cx="${x(i).toFixed(1)}" cy="${y(DC[i]).toFixed(1)}" r="3.2" fill="var(--cyan)" fill-opacity=".95" stroke="var(--panel2)" stroke-width="1"/>`).join('');
  const t=SX[lang],bs=new Set(buys),svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.ch)}">${g}<path d="${p} L${x(e).toFixed(1)} ${H-Bp} L${x(s).toFixed(1)} ${H-Bp} Z" fill="var(--amber)" fill-opacity=".08"/><path d="${m}" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"/><path d="${p}" fill="none" stroke="var(--amber)" stroke-width="1.6" stroke-linejoin="round"/>${dots}</svg>`;
  return hcAttach('sg',svg,{W,H,Lp,R,Tp,Bp,n,x:k=>x(s+k),lab:k=>dIso(s+k)+(bs.has(s+k)?' · '+t.dotS:''),rows:k=>[[t.price,usd(DC[s+k]),'var(--amber)',y(DC[s+k])],[t.ma,IND.m200[s+k]?usd(IND.m200[s+k]):'—','var(--muted)',IND.m200[s+k]?y(Math.max(IND.m200[s+k],lo)):null]]});
}

const LVT=[0,30,70,120,180,250,335];
const earned=()=>QUESTS.filter(q=>G.claimed.includes(q.id)).reduce((a,q)=>a+q.r,0);
const balance=()=>earned()-G.spent;
function levelInfo(){const e=earned();let lv=1;for(let k=0;k<LVT.length;k++)if(e>=LVT[k])lv=k+1;const lo=LVT[lv-1],hi=LVT[lv]??LVT[LVT.length-1];return {lv,e,frac:hi>lo?(e-lo)/(hi-lo):1}}
const stageOf=lv=>lv<=2?1:lv<=4?2:3;
function checkQuests(){const fresh=QUESTS.filter(q=>!G.claimed.includes(q.id)&&q.ok());if(!fresh.length)return;
  fresh.forEach(q=>G.claimed.push(q.id));saveG();SND.reward();
  if(fresh.length===1){const q=fresh[0];toast(`<span class="t-ic">${ACORN(true)}</span><div><b>${GX[lang].earned(q.r)}</b><span>${esc(GX[lang].badge)} · ${esc(q.t())}</span></div>`);}
  else toast(`<span class="t-ic">${ACORN(true)}</span><div><b>${esc(UX[lang].many(fresh.length,fresh.reduce((a,q)=>a+q.r,0)))}</b><span>${fresh.map(q=>esc(q.t())).join('、')}</span></div>`);
  if(fresh.some(q=>q.id[0]==='L'||q.id==='all6'))leaves();
  setMood('happy');renderHUD();}

/* ---------- squirrel ---------- */
function ACORN(gold){
  const n=gold?'#F4C246':'#CFC9AE', c=gold?'#9A5A24':'#A8A288', h=gold?'#FFF1B8':'#E6E1CB';
  return `<svg viewBox="0 0 32 32" aria-hidden="true"><ellipse cx="16" cy="19" rx="9" ry="10" fill="${n}"/><ellipse cx="13" cy="18" rx="2" ry="4" fill="${h}" opacity=".8"/><path d="M5 13 Q16 2 27 13 Q16 17 5 13Z" fill="${c}"/><rect x="15" y="3" width="2.4" height="5" rx="1.2" fill="${c}"/></svg>`;
}
function MEDAL(g,on){return `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 2 L24 14 L32 2" stroke="${on?'#D9534F':'#C9C3AA'}" stroke-width="6" fill="none"/><circle cx="24" cy="28" r="17" fill="${on?'#F4C246':'#E3DEC8'}" stroke="${on?'#C2702A':'#C9C3AA'}" stroke-width="3"/><text x="24" y="35" text-anchor="middle" font-size="18" font-weight="800" fill="${on?'#7A4F2A':'#A8A288'}" font-family="Baloo 2,sans-serif">${g}</text></svg>`}

/* ---------- mood, sound, toasts, leaves ---------- */
let MOOD=null,moodT=null;
function setMood(m){MOOD=m;clearTimeout(moodT);updBuddies();moodT=setTimeout(()=>{MOOD=null;updBuddies()},1900)}
function updBuddies(){const st=stageOf(levelInfo().lv),w=isWinter();
  const h=$('hud-sq'); if(h)h.innerHTML=SQ(st,w,MOOD);
  const g=$('guide-sq'); if(g)g.innerHTML=SQ(st,w,MOOD);
  const t=$('guide-t'); if(t)t.textContent=MOOD?GX[lang].guide[MOOD]:guideText(t.dataset.k);}
let AC=null;
function tone(fs,dur=.12,type='sine'){if(!G.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;
  fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=t0+i*dur;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02)})}catch(e){}}
const SND={ok:()=>tone([660,880]),bad:()=>tone([300,220],.16,'triangle'),reward:()=>tone([523,659,784,1047],.1),tap:()=>tone([520],.05)};
function toast(html){const box=$('toasts');if(!box)return;box.innerHTML='';const d=document.createElement('div');d.className='toast';d.innerHTML=html;box.appendChild(d);setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),400)},3000)}
function leaves(){if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;const L=$('leaves');if(!L)return;
  const cols={spring:['#F7A1C4','#8CCB6B'],summer:['#6CBF5B','#4E9F4A'],autumn:['#E08A3C','#E8B04A'],winter:['#FFFFFF','#CFE3EA']}[season()];
  for(let k=0;k<18;k++){const d=document.createElement('i');d.style.left=(Math.random()*100)+'%';d.style.animationDelay=(Math.random()*.8)+'s';d.style.animationDuration=(2+Math.random()*1.4)+'s';
    d.innerHTML=`<svg viewBox="0 0 20 20" width="18" height="18"><path d="M10 1 C17 5 17 14 10 19 C3 14 3 5 10 1Z" fill="${cols[k%2]}"/><path d="M10 3 L10 18" stroke="rgba(0,0,0,.18)" stroke-width="1"/></svg>`;L.appendChild(d);setTimeout(()=>d.remove(),3800)}}

  const tt=stashTotals(),sats=Math.round(tt.btc*1e8);g.fillStyle='#4A3550';

  else{g.font=F(800,70);g.fillStyle='#B42F6C';g.fillText(x.start,W/2,880);}

  const cw=chips.map(t=>g.measureText(t).width+56),tot=cw.reduce((a,b)=>a+b,0)+24*(chips.length-1);let cx=W/2-tot/2;
  chips.forEach((t,k)=>{rr(cx,975,cw[k],70,35);g.fillStyle=['#FFE3F0','#FFF0CC','#E8DEFF'][k];g.fill();g.fillStyle='#4A3550';g.fillText(t,cx+cw[k]/2,1011);cx+=cw[k]+24});
  if(SHARE.amt&&tt.usdv>0){g.font=F(700,34);g.fillStyle='#4A3550';g.fillText(`${x.inv} ${usd(tt.usdv)}  ·  ${x.val} ${usd(tt.val)}`,W/2,1100);}
  g.font=F(700,34);g.fillStyle='#8A7192';g.fillText(x.tag,W/2,SHARE.amt&&tt.usdv>0?1170:1130);
  g.font=F(600,24);g.fillStyle='#B5A0BA';g.fillText(`${APPNAME[lang]} · ${x.disc} · ${DATA.lastDate}`,W/2,1238);
  SHARE.url=c.toDataURL('image/png');renderStash();const f=document.querySelector('.sharefig');if(f)f.scrollIntoView({behavior:'smooth',block:'center'});}

function goTab(n){tab=n; render(); window.scrollTo({top:0,behavior:'smooth'});}
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]'); if(tb){SND.tap(); goTab(+tb.dataset.tab); return;}
  const g=e.target.closest('[data-go]'); if(g){SND.tap(); cur=Math.max(0,Math.min(N-1,+g.dataset.go)); if(TABS[tab]!=='course'){tab=0;render();} else {$('map').innerHTML=mapSVG(); renderCourse();} const l=$('lvl'); if(l) l.scrollIntoView({behavior:'smooth',block:'start'}); return;}
  if(e.target.closest('[data-locked]')){SND.bad(); setMood('tilt'); toast(`<span class="t-ic">${ico('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',22)}</span><div><b>${esc(GX[lang].locked)}</b></div>`); return;}
  const o=e.target.closest('[data-o]');
  if(o&&!o.disabled){const k=+o.dataset.q, oi=+o.dataset.o, Q=LEVELS[cur].zh.quiz, QS=qset(cur); S.answers[cur+'-'+k]=oi;
    if(oi===Q[QS[k][0]][2]){SND.ok(); setMood('happy')} else {SND.bad(); setMood('tilt')}
    if(QS.every((_,j)=>S.answers[cur+'-'+j]!==undefined)){const r=QS.filter(([qi],j)=>S.answers[cur+'-'+j]===Q[qi][2]).length; if(r>=2){S.passed[cur]=true;save();}}
    renderCourse(); $('map').innerHTML=mapSVG(); renderHUD(); checkQuests(); return;}
  if(e.target.closest('[data-retry]')){for(let k=0;k<3;k++)delete S.answers[cur+'-'+k]; QSET[cur]=null; renderCourse(); return;}
  const dr=e.target.closest('[data-dr]');
  if(dr){const a=dr.dataset.dr;
    if(a==='scam'||a==='safe'){D.picked=a; if((a==='scam')===DRILL[DSET[D.i]].scam){D.right++;SND.ok();setMood('happy')}else{SND.bad();setMood('tilt')}}
    else if(a==='next'){D.i++; D.picked=null; if(D.i>=DSET.length){G.flags.drill=true; if(D.right===DSET.length)G.flags.drillP=true; saveG();}}
    else if(a==='again'){D.i=0;D.picked=null;D.right=0;DSET=shuffle([...Array(DRILL.length).keys()]).slice(0,8);}
    renderDrill(); return;}
  const kk=e.target.closest('[data-k]');
  if(kk){const a=kk.dataset.k;
    if(a==='hide'){K.hidden=true;K.s1=null}
    else if(a==='show'){K.hidden=false;K.s1=null}
    else if(a==='check'){K.pos.forEach(p=>{const el=$('w'+p);if(el)K.ans[p]=el.value});K.s1=K.pos.every(p=>(K.ans[p]||'').trim().toLowerCase()===K.words[p]); if(K.s1){SND.ok();setMood('happy')}else{SND.bad();setMood('tilt')}}
    else if(a==='to1')K.step=1; else if(a==='to2')K.step=2; else if(a==='rest'){K.rest=true;G.flags.custody=true;saveG();} else if(a==='restart')newCustody();
    renderCustody(); return;}
  const ka=e.target.closest('[data-ka]'); if(ka&&!ka.disabled){K.pick=+ka.dataset.ka; if(K.opts[K.pick].ok){SND.ok();setMood('happy')}else{SND.bad();setMood('tilt')} renderCustody(); return;}
  const kn=e.target.closest('[data-kn]'); if(kn&&!kn.disabled){K.net=+kn.dataset.kn; if(K.net===0){SND.ok();setMood('happy')}else{SND.bad();setMood('tilt')} renderCustody(); return;}
  const k3=e.target.closest('[data-k3]'); if(k3){K.s3=k3.dataset.k3; if(K.s3==='test'){SND.ok();setMood('happy')}else{SND.bad();setMood('tilt')} renderCustody(); return;}
  const sa=e.target.closest('[data-st]'); if(sa){stashAction(sa.dataset.st); return;}
  const se=e.target.closest('[data-ste]'); if(se){stashAction('edit',+se.dataset.ste); return;}
  const sx=e.target.closest('[data-stx]'); if(sx){stashAction('askdel',+sx.dataset.stx); return;}

  const by=e.target.closest('[data-buy]'); if(by&&!by.disabled){const it=ITEMS.find(x=>x.id===by.dataset.buy); if(it&&balance()>=it.cost&&!G.owned.includes(it.id)){G.spent+=it.cost;G.owned.push(it.id);G.wear[it.cat]=it.id;saveG();SND.reward();setMood('happy');renderHUD();renderQuests();} return;}

  const gc=e.target.closest('[data-gcat]'); if(gc){GCAT=gc.dataset.gcat; document.querySelectorAll('[data-gcat]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.gcat===GCAT)); drawGloss(); return;}
  if(e.target.closest('[data-rebal]')){REB.shown=true; G.flags.rebal=true; saveG(); drawRebalOut(); SND.tap(); checkQuests(); return;}

    if(a==='ask')RESETQ=true; else if(a==='no')RESETQ=false;
    else if(a==='yes'){RESETQ=false; S.passed=Array(N).fill(false); S.answers={}; save(); const keep=G.sound; Object.assign(G,{claimed:[],spent:0,owned:[],wear:{hat:null,scarf:null,bag:null,glasses:null},flags:{},sound:keep}); saveG(); cur=0; D.i=0;D.picked=null;D.right=0; newCustody(); toast(`<div><b>${esc(GX[lang].set.resetDone)}</b></div>`);
      /* quests already satisfied by stash/plan/rule will be re-earned */ }
    render(); return;}
});
